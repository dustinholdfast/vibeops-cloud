name: Uptime checks

# Drives /api/cron/uptime from GitHub rather than Vercel cron.
#
# Vercel Hobby only accepts once-daily cron expressions, and a daily check is
# not monitoring. GitHub Actions allows a five-minute schedule on free runners,
# so it is the scheduler on that plan. On Vercel Pro, prefer a Vercel cron
# entry in vercel.json and disable this workflow — see UPTIME_ROLLOUT.md.
#
# The endpoint decides for itself which monitors are due, so running late, or
# twice, is harmless.

on:
  schedule:
    # Five minutes is the finest interval GitHub accepts, and it is best
    # effort: scheduled runs are queued on shared infrastructure and can be
    # late or skipped when it is busy. Treat this as "roughly every 5-15
    # minutes", not a guarantee.
    - cron: '*/5 * * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Report what would happen without writing or emailing'
        type: boolean
        default: false

# Never let a slow run overlap the next tick.
concurrency:
  group: uptime-checks
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Run due monitors
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::Set both the APP_URL and CRON_SECRET repository secrets."
            exit 1
          fi

          url="${APP_URL%/}/api/cron/uptime"
          if [ "${DRY_RUN:-false}" != "true" ]; then
            url="${url}?send=1"
          fi

          # A monitored site being down is a 200 from our endpoint carrying
          # "down" in the body — not a workflow failure. Only a non-2xx is
          # worth failing over: a wrong secret, or an unapplied migration.
          body=$(curl -sS --fail-with-body --max-time 120 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${url}")

          echo "$body" | jq . || echo "$body"

          {
            echo "### Uptime run"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Mode | $(echo "$body" | jq -r '.mode // "unknown"') |"
            echo "| Due | $(echo "$body" | jq -r '.due // 0') |"
            echo "| Checked | $(echo "$body" | jq -r '.checked // 0') |"
            echo "| Down | $(echo "$body" | jq -r '.down // 0') |"
            echo "| Alerts sent | $(echo "$body" | jq -r '.alerts // 0') |"
          } >> "$GITHUB_STEP_SUMMARY"

          # Name anything that is failing, so the run list is readable without
          # opening the log.
          echo "$body" \
            | jq -r '.outcomes[]? | select(.ok == false) | "::warning::\(.projectName) is not responding: \(.error // "no reason given")"'
